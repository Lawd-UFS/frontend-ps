<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS LAWD - Login</title>

    <!--STYLE GLOBAL-->
    <link rel="stylesheet" type="text/css" href="style.css" media ="all">

    <!--GOOGLE FONTS = SPACE GROTESK LIGHT 300-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <!--ICONE DA ABA-->
    <link rel="icon" type="image/png" href="imagens/logo.png">
</head>
<body>
    <header>
        <div class="icons">
            <img src="images/logo-lawd.png" class="img-icon"></img>
            <img src="images/lawd.png" class="img-lawd"></img>
        </div>
        <button>Cadastre-se</button>
    </header>
    <main>
        <h1>Login</h1>
        <div class="loginScreen">
            <form>
                <label for="user">Usuário ou Email</label>
                <input type="text" id="user" name="user" required>
                <label for="senha">Senha</label>
                <input type="password" id="password" name="password" required>
                <a href="##" class="password">Esqueceu a senha?</a>
            </form>
            <p>Ou entre com:</p>
            <div class="loginScreen-othersWays">
                <div class="loginLink">
                    <img src="images/google.png" class="icon-login"></img>
                    <p>Google</p>
                </div>
                <div class="loginLink">
                    <img src="images/github.png" class="icon-login"></img>
                    <p>Github</p>
                </div>
            </div>
            <button class="loginButton">Continuar</button>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
