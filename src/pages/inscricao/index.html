<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PS LAWD 2026 - Inscrição</title>
  </head>

  <body>
    <header>
      <div class="navbar">
        <p>Processo Seletivo</p>
        <div class="icons">
          <img
            src="../../assets/images/logo-lawd.png"
            alt="Logo da LAWD"
            class="img-icon"
          />
          <img
            src="../../assets/images/lawd.png"
            alt="Logotipo da LAWD"
            class="img-lawd"
          />
        </div>
      </div>
    </header>
    <main>
      <div class="registerScreen">
        <div class="enrollment">
          <h1>Inscrição</h1>
          <div class="section-type">
            <p id="section-name">Dados básicos</p>
            <div class="section">
              <div id="section1-icon" class="icon-section">1</div>
              <hr />
              <div id="section2-icon" class="icon-section">2</div>
              <hr />
              <div id="section3-icon" class="icon-section">3</div>
            </div>
          </div>
        </div>
        <div class="section-inputs" id="section1">
          <form>
            <div class="column">
              <label for="name"
                >Nome completo:
                <input
                  type="text"
                  id="name"
                  name="name"
                  required
                  placeholder="Seu nome"
                />
              </label>
              <label for="gender"
                >Gênero:
                <select id="gender" name="gender" required>
                  <option value="" disabled selected>Selecione</option>
                  <option value="Homem cisgênero">Homem cisgênero</option>
                  <option value="Mulher cisgênero">Mulher cisgênero</option>
                  <option value="Homem transgênero">Homem transgênero</option>
                  <option value="Mulher transgênero">Mulher transgênero</option>
                  <option value="Não-binário">Não-binário</option>
                  <option value="Não declarado">Prefiro não declarar</option>
                </select>
              </label>
              <label for="course"
                >Curso:
                <input
                  type="text"
                  id="course"
                  name="course"
                  required
                  placeholder="ex: Design Gráfico"
                />
              </label>
            </div>
            <div class="column">
              <label for="date-birth"
                >Data de nascimento:
                <input
                  type="date"
                  id="date-birth"
                  name="birthDate"
                  min="1900-01-01"
                  required
                />
              </label>
              <label for="pronoun"
                >Pronome:
                <select id="pronoun" name="pronoun" required>
                  <option value="" disabled selected>Selecione</option>
                  <option value="Ele/dele">Ele/Dele</option>
                  <option value="Ela/dela">Ela/Dela</option>
                  <option value="Elu/delu">Elu/Delu</option>
                </select>
              </label>
              <label for="period"
                >Período atual:
                <input
                  type="number"
                  id="period"
                  min="1"
                  max="20"
                  name="period"
                  required
                  placeholder="1"
                />
              </label>
            </div>
          </form>
        </div>
        <div class="section-inputs" id="section2">
          <form>
            <div class="column">
              <label for="interests"
                >Quais seus interesses?
                <textarea
                  name="interests"
                  id="interests"
                  required
                  placeholder="Ex: Hobbies, áreas de estudo, etc."
                ></textarea>
              </label>
              <label for="skills"
                >Quais habilidades você possui?
                <textarea
                  name="skills"
                  id="skills"
                  required
                  placeholder="ex: Design Gráfico"
                ></textarea>
              </label>
              <label for="knowledge-level"
                >Conhecimento em desenvolvimento web:
                <select id="knowledge-level" name="knowledgeLevel" required>
                  <option value="" disabled selected>Selecione</option>
                  <option value="Nenhum">Nenhum</option>
                  <option value="Iniciante">Iniciante</option>
                  <option value="Intermediário">Intermediário</option>
                  <option value="Avançado">Avançado</option>
                </select>
              </label>
            </div>
            <div class="column">
              <label for="linkedin">
                <div>Link do LinkedIn <span> (Opcional) </span></div>
                <input
                  type="url"
                  id="linkedin"
                  name="linkedin"
                  placeholder="https://linkedin.com/in/..."
                />
              </label>

              <label for="github">
                <div>Link do GitHub <span> (Opcional) </span></div>
                <input
                  type="url"
                  id="github"
                  name="github"
                  placeholder="https://github.com/..."
                />
              </label>

              <label for="portfolio">
                <div>Link para Portfólio <span> (Opcional) </span></div>
                <input
                  type="url"
                  id="portfolio"
                  name="portfolioExternalLink"
                  placeholder="Behance, Dribbble, site..."
                />
              </label>

              <label for="email">
                Seu melhor email:
                <input
                  type="email"
                  id="email"
                  name="email"
                  required
                  placeholder="exemplo@email.com"
                />
              </label>
            </div>
          </form>
        </div>
        <div class="section-inputs" id="section3">
          <form>
            <div class="column">
              <label for="motivation"
                >Qual sua motivação para entrar na LAWD?
                <textarea
                  name="motivation"
                  id="motivation"
                  required
                  placeholder="Indique aqui o porquê você quer fazer parte da liga"
                ></textarea>
              </label>
            </div>
            <div class="column">
              <label for="source">
                Como você ficou sabendo do PS da LAWD?
                <div class="checkbox-group">
                  <label class="checkbox-label">
                    <input
                      type="checkbox"
                      class="checkbox-input"
                      name="source"
                      value="Instagram"
                    />
                    Divulgação no Instagram
                  </label>
                  <label class="checkbox-label">
                    <input
                      type="checkbox"
                      class="checkbox-input"
                      name="source"
                      value="Whatsapp"
                    />
                    Repasses no Whatsapp
                  </label>
                  <label class="checkbox-label">
                    <input
                      type="checkbox"
                      class="checkbox-input"
                      name="source"
                      value="Cartazes"
                    />
                    Cartazes na UFS
                  </label>
                  <label class="checkbox-label">
                    <input
                      type="checkbox"
                      class="checkbox-input"
                      name="source"
                      value="LinkedIn"
                    />
                    LinkedIn
                  </label>
                  <label class="checkbox-label">
                    <input
                      type="checkbox"
                      class="checkbox-input"
                      name="source"
                      value="Amigos"
                    />
                    Recomendação de amigos
                  </label>
                  <label class="checkbox-label">
                    <input
                      type="checkbox"
                      class="checkbox-input"
                      name="source"
                      value="Outros"
                    />
                    Outros
                  </label>
                </div>
              </label>
            </div>
          </form>
        </div>
        <dialog id="submitDialog">
          <div class="modal">
            <img
              width="87px;"
              src="../../assets/images/paper-plane.svg"
              alt="Ilustração de um avião de papel"
            />
            Você confirma o envio desse formulário?
            <div>
              <button id="closeModal" class="second-button">Voltar</button>
              <button id="confirmSubmit">Confirmar envio</button>
            </div>
          </div>
        </dialog>
        <dialog id="emailDialog">
          <div class="modal">
            <img
              width="87px;"
              src="../../assets/images/email.svg"
              alt="Ilustração de uma mão segurando uma carta"
            />
            <h2>Verifique seu email!</h2>
            <p>Enviamos um link de confirmação para sua conta.</p>
            <p style="font-size: 14px; margin-top: 15px;"><strong>Atenção:</strong> Nosso servidor do Discord será o mural de informativos e local de realização das reuniões online.</p>
            <a href="https://discord.com/invite/8yRDGWXgZ" target="_blank" rel="noopener noreferrer" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin: 20px auto; padding: 12px 24px; background-color: #5865F2; color: #ffffff; text-decoration: none; font-weight: 600; font-size: 15px; border-radius: 8px; width: fit-content; transition: background-color 0.2s ease; border: none; outline: none; box-shadow: 0 4px 10px rgba(88, 101, 242, 0.3);">
              <svg width="22" height="22" viewBox="0 0 127.14 96.36" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a67.59,67.59,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.33,46,96.22,53,91.08,65.69,84.69,65.69Z"/>
              </svg>
              Entrar no Discord
            </a>
            <div>
              <button id="closeEmailDialog" class="second-button">
                Fechar
              </button>
              <button id="reSendEmailButton" class="second-button">
                Reenviar email
              </button>
            </div>
          </div>
        </dialog>
      </div>
      <div class="continue">
        <button class="registerButton">Continuar</button>
      </div>
    </main>
  </body>
</html>
