<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>PS LAWD 2026 - Candidatos</title>
  </head>
  <body>
    <section>
      <div class="table">
        <div class="table_header">
          <div class="table_header_left_side">
            <h2>Lista de Candidatos</h2>
          </div>

          <div class="table_header_right_side">
            <div class="search_container">
              <input type="text" id="filter-name" class="search-input" placeholder="Buscar por nome..." />
              <select id="filter-course" class="filter-select">
                <option value="">Todos os Cursos</option>
              </select>
              <select id="filter-period" class="filter-select">
                <option value="">Todos os Períodos</option>
              </select>
              <select id="filter-knowledge" class="filter-select">
                <option value="">Qualquer Nível</option>
                <option value="Nenhum">Nenhum</option>
                <option value="Iniciante">Iniciante</option>
                <option value="Intermediário">Intermediário</option>
                <option value="Avançado">Avançado</option>
              </select>
              <button id="apply-filters-btn" class="search-btn">Buscar</button>
            </div>
            <div class="status_filters_container">
              <p>Status:</p>
              <button class="scheduling_button">
                <img src="../../assets/images/schedule-pic.png" alt="schedule" />
                Agendado
              </button>
              <button class="done_button">
                <img src="../../assets/images/circle.png" alt="circle" />
                Concluido
              </button>
              <button class="delete_button">
                <img src="../../assets/images/trash_can.png" alt="trash" />
                Eliminados
              </button>
            </div>
          </div>
        </div>

        <div class="table_body">
          <table>
            <thead>
              <tr>
                <th>Status</th>
                <th>Candidatos</th>
                <th>Telefone</th>
                <th>Curso</th>
                <th>Período</th>
                <th>Ranking</th>
                <th>Ver Mais</th>
              </tr>
            </thead>

            <tbody></tbody>
          </table>
        </div>
        
      </div>
    </section>
  </body>
</html>
