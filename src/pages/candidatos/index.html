<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>PS LAWD 2026 - Candidatos</title>
  </head>
  <body>
    <section>
      <div class="table">
        <div class="table_header">
          <div class="table_header_left_side">
            <div class="table_header_title_row">
              <h2>Lista de Candidatos</h2>
              <div class="candidates-total" aria-live="polite">
                <span class="candidates-total__label">Total</span>
                <span class="candidates-total__count">0</span>
              </div>
            </div>
          </div>

          <div class="table_header_right_side">
            <p class="filters-label">Filtros:</p>
            <div class="filter-status-group" role="group" aria-label="Status">
              <button type="button" class="scheduling_button">
                <img src="../../assets/images/schedule-pic.png" alt="" aria-hidden="true" />
                <span>Agendado</span>
              </button>
              <button type="button" class="done_button">
                <img src="../../assets/images/circle.png" alt="" aria-hidden="true" />
                <span>Concluído</span>
              </button>
              <button type="button" class="delete_button">
                <img src="../../assets/images/trash_can.png" alt="" aria-hidden="true" />
                <span>Eliminados</span>
              </button>
            </div>
            <div class="filter-selects-group">
              <select id="filter-course" class="filter-select" aria-label="Filtrar por curso">
                <option value="">Todos os Cursos</option>
              </select>
              <select id="filter-period" class="filter-select" aria-label="Filtrar por período">
                <option value="">Todos os Períodos</option>
              </select>
            </div>
          </div>
        </div>

        <div class="table_body">
          <table>
            <thead>
              <tr>
                <th>Status</th>
                <th>Candidatos</th>
                <th>Telefone</th>
                <th>Curso</th>
                <th>Período</th>
                <th>Ranking</th>
                <th>Ver Mais</th>
              </tr>
            </thead>

            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </body>
</html>
