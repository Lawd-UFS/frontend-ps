<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PS LAWD 2025 - Inscrição</title>
  </head>
  <body>
    <header id="header">
      <div>
        <p>Processo Seletivo</p>
        <div class="icons">
          <img
            src="../../assets/images/logo-lawd.png"
            alt="Logo da LAWD"
            class="img-icon"
          />
          <img
            src="../../assets/images/lawd.png"
            alt="Logotipo da LAWD"
            class="img-lawd"
          />
        </div>
      </div>
    </header>
    <main>
      <div id="register-screen">
        <header>
          <h1>Sua inscrição foi enviada!</h1>
        </header>
        <section>
          <div class="instructions-container">
            <img
              id="loving-doodle"
              src="../../assets/images/loving-doodle.svg"
              alt="Ilustração de uma pessoa fazendo um coração roxo com as mãos"
            />
            <div class="register-text-container">
              <div class="register-text">
                <img
                  src="../../assets/images/celebration.svg"
                  alt="ícone de celebração"
                />

                Ficamos feliz por você querer fazer parte do nosso time :)
                Estamos torcendo por você!
              </div>
              <div class="register-text">
                <img
                  src="../../assets/images/mystery.svg"
                  alt="ícone de lupa"
                />
                Fique de olho nas próximas etapas. Acesse o link para agendar
                sua entrevista.
              </div>
            </div>
          </div>
          <div class="buttons-container">
            <!-- TODO colocar o link do discord -->
            <button
              class="discord-button"
              onclick="location.href='https://t.me/LawdDcomp_bot';"
            >
              <img
                src="../../assets/images/discord.svg"
                alt="ícone do aplicativo Discord"
              />

              Discord do PS
            </button>
            <button
              class="chatbot-button"
              onclick="location.href='https://t.me/LawdDcomp_bot';"
            >
              Agendamento de Entrevistas
            </button>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
