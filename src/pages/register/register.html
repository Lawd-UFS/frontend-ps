<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS LAWD - Cadastro</title>

    <!--STYLE LOCAL-->
    <link rel="stylesheet" type="text/css" href="register.css" media ="all">
    
    <!--STYLE GLOBAL-->
    <link rel="stylesheet" type="text/css" href="../index.css" media ="all">

    <!--GOOGLE FONTS = SPACE GROTESK LIGHT 300-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <!--ICONE DA ABA-->
    <!--<link rel="icon" type="image/png" href="../imagens/logo.png">-->

    <!--SCRIPT LOCAL-->
    <script src="register.js" defer></script>
</head>
<body>
    <header>
        <a href='##' class="back">
            <img src="../images/arrow_back.png" class="img-arrow">
            Voltar
        </a>
        <div class="navbar">
            <p>Processo Seletivo</p>
            <div class="icons">
                <img src="../images/logo-lawd.png" class="img-icon"></img>
                <img src="../images/lawd.png" class="img-lawd"></img>
            </div>
        </div>
    </header>
    <main>
        <div class="registerScreen">
            <div class="enrollment">
                <h1>Inscrição</h1>
                <div class="section-type">
                    <p id="section-name">Dados básicos</p>
                    <div class="section">
                        <img src="../images/section-on.png" id="section1-icon" class="icon-section">
                        <img src="../images/section-off.png" id="section2-icon" class="icon-section">
                        <img src="../images/section-off.png" id="section3-icon" class="icon-section">
                    </div>
                </div>
            </div>
            <div class="section-inputs" id="section1">
                <form>
                    <label for="name">Nome completo:
                        <input type="text" id="name" name="name" required>
                    </label>
                    <label for="date-birth">Data de nascimento:
                        <input type="date" id="date-birth" name="date-birth" required>
                    </label>
                    <label for="pronoun">Pronome:
                        <select id="pronoun" name="pronoun" required>
                            <option value="he/him">Ele/Dele</option>
                            <option value="she/her">Ela/Dela</option>
                            <option value="other">Outro</option>
                        </select>
                    </label>
                    <label for="gender">Gênero:
                        <select id="gender" name="gender" required>
                            <option value="male">Homem cisgênero</option>
                            <option value="female">Mulher cisgênero</option>
                            <option value="male-t">Homem transgênero</option>
                            <option value="female-t">Mulher transgênero</option>
                            <option value="nb">Não-binário</option>
                            <option value="other">Outro</option>
                        </select>
                    </label>
                    <label for="course">Curso:
                        <input type="text" id="course" name="course" required placeholder="Certifique-se da escrita correta.">
                    </label>
                    <label for="period">Periódo atual:
                        <input type="number" id="period" name="period" required placeholder="1">
                    </label>
                </form>
            </div>
            <div class="section-inputs" id="section2">
                <h1>PARTE 2</h1>
            </div>
            <div class="section-inputs" id="section3">
                <h1>PARTE 3</h1>
            </div>
        </div>
        <div class="continue">
            <button class="registerButton" onclick="changeSection()">Continuar</button>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
