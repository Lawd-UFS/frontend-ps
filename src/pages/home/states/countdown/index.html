<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Processo Seletivo - LAWD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <div class="navbar">
        <p>Processo Seletivo</p>
        <div class="icons">
          <img
            src="../../../../assets/images/logo-lawd.png"
            alt="Logo da LAWD"
            class="img-icon"
          />
          <img
            src="../../../../assets/images/lawd.png"
            alt="Logotipo da LAWD"
            class="img-lawd"
          />
        </div>
      </div>
    </header>

    <main>
      <div class="confirmation-card">
        <div class="state cd-container-card">
          <div class="cd-message">
            <h1>Aguarde!<br />Disponível no dia 01.06</h1>
          </div>
          <div class="cd-count">
            <h1 class="cd-faltam">Faltam:</h1>
            <div class="count">
              <div class="count-container">
                <h1 id="day">00</h1>
                <p>dias</p>
              </div>
              <div class="count-container">
                <h1 id="hours">00</h1>
                <p>horas</p>
              </div>
              <div class="count-container">
                <h1 id="minutes">00</h1>
                <p>minutos</p>
              </div>
              <div class="count-container">
                <h1 id="seconds">00</h1>
                <p>segundos</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
