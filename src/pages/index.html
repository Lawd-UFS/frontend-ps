<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Processo Seletivo - LAWD</title>
</head>

<body>
  <div class="cd-container">
    <div class="cd-message">
      <h1>Aguarde!<br />Disponível no dia 01.06</h1>
    </div>
    <div class="cd-count">
      <h1>Faltam:</h1>
      <div class="count">
        <div class="count-container">
          <h1 id="day">00</h1>
          <p>dias</p>
        </div>
        <div class="count-container">
          <h1 id="hours">00</h1>
          <p>horas</p>
        </div>
        <div class="count-container">
          <h1 id="minutes">00</h1>
          <p>mínutos</p>
        </div>
        <div class="count-container">
          <h1 id="seconds">00</h1>
          <p>segundos</p>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
