        <meta charset="UTF-8">

    <body>
        <div class="cd-container">
            <div class="cd-message">
                <h1>Aguarde!</h1>
                <h1>Disponível no dia 24.02</h1>
            </div>
            <div class="cd-count">
                <h1>Faltam</h1>
                <div class="count">
                    <div class="count-container">
                        <h1 id="day">00</h1>
                        <p>dias</p>
                    </div>
                    <div class="count-container">
                        <h1 id="hours">00</h1>
                        <p>horas</p>
                    </div>
                    <div class="count-container">
                        <h1 id="minutes">00</h1>
                        <p>mínutos</p>
                    </div>
                    <div class="count-container">
                        <h1 id="seconds">00</h1>
                        <p>segundos</p>
                    </div>
                </div>
            </div>
        </div>
    </body>

    </html>
