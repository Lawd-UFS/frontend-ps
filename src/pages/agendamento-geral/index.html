<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>PS LAWD 2026 - Agendamento Geral</title>
  </head>
  <body>
    <section>
      <div class="schedules-page">
        <div class="schedules-header">
          <div>
            <h2>Lista de Entrevistas</h2>
          </div>

          <div class="filters">
            <p>Filtros:</p>
            <button class="filter-button pending">
              <img src="../../assets/images/schedule-pic.png" alt="schedule" />
              Pendentes
            </button>
            <button class="filter-button completed">
              <img src="../../assets/images/circle.png" alt="circle" />
              Concluídos
            </button>
            <button class="filter-button presential">Presencial</button>
            <button class="filter-button remote">Remoto</button>
          </div>
        </div>

        <div class="schedules-content">
          <table>
            <thead>
              <tr>
                <th>Horário</th>
                <th>Candidato</th>
                <th>Avaliador</th>
                <th>Modalidade</th>
                <th>Status</th>
                <th>Ver mais</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </body>
</html>
