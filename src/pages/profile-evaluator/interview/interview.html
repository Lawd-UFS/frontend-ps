<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS LAWD - Entrevista</title>

    <!--STYLE GLOBAL-->
    <link rel="stylesheet" type="text/css" href="../../../pages/index.css" media ="all">

    <!--STYLE LOCAL-->
    <link rel="stylesheet" type="text/css" href="interview.css" media ="all">
    

    <!--GOOGLE FONTS = SPACE GROTESK LIGHT 300-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <!--ICONE DA ABA-->
    <!--<link rel="icon" type="image/png" href="../imagens/logo.png">-->

    <!--SCRIPT GLOBAL-->
    <script src="interview.js" defer></script>
</head>
<body>
    <header>
        <div class="menu">
            <div class="icons">
                <img src="../../images/logo-lawd.png" class="img-icon">
                <img src="../../images/lawd.png" class="img-lawd">
            </div>
            <ul class="navbar">
                <li>CANDIDATOS</li>
                <li>AGENDAMENTO</li>
                <li class="page">ENTREVISTA</li>
                <li>PERFIL</li>
            </ul>
            <div class="profile">
                <img src="../../images/icon-user.png" class="icon-user">
                <span class="name-user">Nome Sobrenome</span>
            </div>
        </div>
    </header>
    <main>
        <img src="../../images/lawd-background.svg" class="lawd-background">
        <ul class="menu-interview">
            <li class="interview-option interview-select" id="application">Aplicação</li>
            <li class="interview-option" id="about">Sobre</li>
            <li class="interview-option" id="result">Resultado</li>
        </ul>

        <div class="content-result">
            <div class=" box graphic">
            </div>
            <div class="box">
                <h4>Resumo de <span id="candidate-name">Candidato</span></h4>
                <div class="result">
                    <p>Valores da liga</p>
                    <div class="points-ball">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <p class="points-number" id="points-1">6</p>
                    </div>
                </div>
                <div class="result">
                    <p>Conhecimento</p>
                    <div class="points-ball">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <p class="points-number" id="points-1">12</p>
                    </div>
                </div>
                <div class="result">
                    <p>Liderança</p>
                    <div class="points-ball">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <img src="../../images/point-ball.png" class="ball-icon">
                        <p class="points-number" id="points-1">8</p>
                    </div>
                </div>
                <div class="row"></div>
                <div class="rank">
                    <h4>Posição no ranking</h4>
                    <h3 id="candidate-rank">7°</h3>
                </div>
            </div>
        </div>
    </main>
    <footer>

    </footer>
</body>
</html>
