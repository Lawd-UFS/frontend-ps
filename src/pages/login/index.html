<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PS LAWD - Login</title>

    <!--GOOGLE FONTS = SPACE GROTESK LIGHT 300-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <!--ICONE DA ABA-->
    <!--<link rel="icon" type="image/png" href="../imagens/logo.png">-->
  </head>

  <body>
    <header>
      <div class="icons">
        <img src="../../assets/images/logo-lawd.png" class="img-icon" />
        <img src="../../assets/images/lawd.png" class="img-lawd" />
      </div>
      <button>Cadastre-se</button>
    </header>
    <main>
      <h1>Login</h1>
      <div class="loginScreen">
        <form>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required placeholder="" />
          <label for="password">Senha</label>
          <div class="password-container">
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder=""
            />
            <img
              src="../../assets/images/visibility-off.png"
              class="password-visibility"
              id="visibility"
            />
          </div>

          <button class="loginButton">Continuar</button>
        </form>
      </div>
    </main>
  </body>
</html>
