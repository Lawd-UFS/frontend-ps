<!DOCTYPE html>
<backhtml lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PS LAWD - Login</title>


        <!--GOOGLE FONTS = SPACE GROTESK LIGHT 300-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

        <!--ICONE DA ABA-->
        <!--<link rel="icon" type="image/png" href="../imagens/logo.png">-->

    </head>

    <body>
        <header>
            <div class="icons">
                <img src="../../assets/images/logo-lawd.png" class="img-icon"></img>
                <img src="../../assets/images/lawd.png" class="img-lawd"></img>
            </div>
            <button>Cadastre-se</button>
        </header>
        <main>
            <h1>Login</h1>
            <div class="loginScreen">
                <form>
                    <label for="user">Email</label>
                    <input type="text" id="user" name="user" required>
                    <label for="password">Senha</label>
                    <div class="password-container">
                        <input type="password" id="password" name="password" required>
                        <img src="../../assets/images/visibility-off.png" class="password-visibility" id="visibility">
                    </div>
                    <a href="##" class="password">Esqueceu a senha?</a>
                </form>
                <button class="loginButton">Continuar</button>
                <p class="text-othersWays">Ou entre com:</p>
                <div class="loginScreen-othersWays">
                    <div class="loginLink">
                        <img src="../../assets/images/google.png" class="icon-login"></img>
                        <p>Google</p>
                    </div>
                    <div class="loginLink">
                        <img src="../../assets/images/github.png" class="icon-login"></img>
                        <p>Github</p>
                    </div>
                </div>
            </div>
        </main>
    </body>

    </html>
